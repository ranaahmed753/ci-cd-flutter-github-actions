name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android_ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android_ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

permissions:
  contents: read

jobs:
  analyze:
    name: Static analysis & formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --fatal-infos

  test:
    name: Unit & widget tests
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Build Android artifacts
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        build-type: [ apk, appbundle ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILENAME: upload-key.jks
        run: |
          # --ignore-garbage tolerates stray newlines/whitespace introduced
          # when a secret is copy-pasted through the GitHub UI or a shell.
          # NOTE: this project's android/build.gradle resolves storeFile
          # relative to android/, not android/app/ (confirmed by the
          # validateSigningRelease error path) — write it there.
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "android/${KEYSTORE_FILENAME}"

          # Fail fast with a clear message instead of a broken keystore
          # surfacing as a mysterious signing error two steps later.
          if ! keytool -list -keystore "android/${KEYSTORE_FILENAME}" \
                -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" > /dev/null 2>&1; then
            echo "::error::Decoded keystore is invalid. Regenerate the ANDROID_KEYSTORE_BASE64 secret with: base64 -w 0 your-keystore.jks (macOS: base64 -i your-keystore.jks | tr -d '\n')"
            exit 1
          fi

      - name: Create key.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEYSTORE_FILENAME: upload-key.jks
        run: |
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_FILENAME
          EOF

      - name: Build APK (release)
        if: matrix.build-type == 'apk'
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (release)
        if: matrix.build-type == 'appbundle'
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        if: matrix.build-type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload App Bundle artifact
        if: matrix.build-type == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: release-appbundle
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/upload-key.jks
          rm -f android/key.properties